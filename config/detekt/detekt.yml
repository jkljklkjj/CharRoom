# detekt 1.23.7. Unspecified rules inherit the bundled default configuration.
# Formatting requires a separate plugin and is not configured here.
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

complexity:
  LongMethod:
    threshold: 50
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 8
  CyclomaticComplexMethod:
    threshold: 10
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 25
  LargeClass:
    threshold: 500
  ComplexCondition:
    threshold: 3
  NestedBlockDepth:
    threshold: 4
  MethodOverloading:
    active: true

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MaxLineLength:
    maxLineLength: 120
    ignoreAnnotated: ['Composable']
  MagicNumber:
    active: false # Preserve the existing Compose policy for UI dimensions.
  ReturnCount:
    max: 2
    ignoreAnnotated: ['Composable']
  WildcardImport:
    active: false
  ForbiddenComment:
    comments:
      - reason: 'Resolve the TODO before merging.'
        value: 'TODO'
      - reason: 'Resolve the FIXME before merging.'
        value: 'FIXME'
      - reason: 'Replace the HACK before merging.'
        value: 'HACK'
  UnusedPrivateMember:
    active: true
  ExpressionBodySyntax:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  SafeCast:
    active: true
  UnnecessaryLet:
    active: true
  ProtectedMemberInFinalClass:
    active: true
  DataClassContainsFunctions:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

exceptions:
  # Use the default generic exception list. CancellationException must propagate.
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  PrintStackTrace:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingExceptionFromFinally:
    active: true

performance:
  SpreadOperator:
    active: true

potential-bugs:
  UnnecessarySafeCall:
    active: true
  UnreachableCode:
    active: true
