server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # Known routes have independent SEO shells, including noindex private entries.
    # Unknown URLs return a real 404 instead of an indexable homepage copy.
    location = /404.html {
        internal;
    }
    error_page 404 /404.html;
    # Discovery manifests must never enter SPA or Markdown fallback handling.
    location ~ ^/(?:\.well-known/(?:ard|ai-catalog)|ai-catalog)\.json$ {
        types { }
        default_type application/json;
        expires -1;
        error_page 404 = @catalog_not_found;
        try_files $uri =404;
    }
    location @catalog_not_found {
        default_type application/json;
        return 404 '{"error":"catalog_not_found"}';
    }
    location ~ ^/(features|faq|compare|app|verify|reset|admin|copilot)/$ {
        return 301 /$1$is_args$args;
    }
    location ~ ^/(features|faq|compare|app|verify|reset|admin|copilot)$ {
        try_files $uri/index.html =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
