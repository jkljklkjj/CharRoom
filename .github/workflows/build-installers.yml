name: Build native installers

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master

jobs:
  build-windows:
    name: Build MSI + ZIP (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Prepare icons (Windows)
        shell: powershell
        run: |
          $icons = "packaging/icons"
          if (-Not (Test-Path $icons)) { Write-Host "No icons folder found: $icons"; exit 0 }
          $png = Join-Path $icons 'app.png'
          $pngb64 = Join-Path $icons 'app.png.b64'
          $ico = Join-Path $icons 'app.ico'
          $svg = Join-Path $icons 'app.svg'
          # If SVG exists, prefer converting it to PNG first
          if (-Not (Test-Path $png) -and (Test-Path $svg)) {
            choco install imagemagick -y
            Write-Host "Generating $png from $svg"
            magick convert $svg $png
          }
          # Fallback: decode base64 PNG if provided
          if (-Not (Test-Path $png) -and (Test-Path $pngb64)) {
            Write-Host "Decoding base64 png to $png"
            [IO.File]::WriteAllBytes($png, [Convert]::FromBase64String((Get-Content $pngb64 -Raw)))
          }
          if (-Not (Test-Path $ico) -and (Test-Path $png)) {
            choco install imagemagick -y
            Write-Host "Generating $ico from $png"
            magick convert $png -define icon:auto-resize=256,128,64,48,32,16 $ico
          } else { Write-Host "Icon already exists or png missing" }

      - name: Install WiX (choco)
        run: choco install wixtoolset -y

      - name: Create server.properties
        run: |
          New-Item -ItemType Directory -Force -Path src\commonMain\resources
          Set-Content -Path src\commonMain\resources\server.properties -Value "server.ip=chatlite.xin"
        shell: powershell

      - name: Set up Python for packaging tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Windows signing script
        shell: pwsh
        run: python scripts/tests/test_windows_signing.py

      - name: Build installers
        run: .\gradlew.bat clean stageDesktopReleaseArtifacts desktopSizeReport --no-daemon

      - name: Optional code signing (Windows)
        shell: powershell
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX -and -not $env:WINDOWS_PFX_PASSWORD) {
            Write-Host 'Skipping Windows code signing: secrets not provided.'
            exit 0
          }
          ./scripts/sign-windows.ps1 -Files 'build/release-artifacts/desktop/*.msi'

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: desktop-size-windows
          path: build/reports/packaging/desktop-size.txt
          if-no-files-found: error

      - name: List staged desktop artifacts (Windows)
        shell: powershell
        run: |
          if (Test-Path 'build\release-artifacts\desktop') { Get-ChildItem -Path build\release-artifacts\desktop -Recurse -Force | Select-Object FullName,Length } else { Write-Host 'No staged desktop artifacts found' }

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: build/release-artifacts/desktop/**
          compression-level: 0
          if-no-files-found: error

  build-macos:
    name: Build DMG + ZIP (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Prepare icons (macOS)
        run: |
          ICON_DIR=packaging/icons
          if [ ! -d "$ICON_DIR" ]; then
            echo "No icon dir: $ICON_DIR"; exit 0
          fi
          if [ -f "$ICON_DIR/app.icns" ]; then
            echo "app.icns exists"
          else
            # If app.svg is provided, convert it to app.png (prefer SVG)
            if [ ! -f "$ICON_DIR/app.png" ] && [ -f "$ICON_DIR/app.svg" ]; then
              echo "Converting app.svg -> app.png"
              brew install imagemagick || true
              magick convert "$ICON_DIR/app.svg" "$ICON_DIR/app.png" || true
            fi
            # decode base64 if present
            if [ ! -f "$ICON_DIR/app.png" ] && [ -f "$ICON_DIR/app.png.b64" ]; then
              echo "Decoding app.png from base64"
              base64 --decode "$ICON_DIR/app.png.b64" > "$ICON_DIR/app.png"
            fi
            if [ -f "$ICON_DIR/app.png" ]; then
              echo "Generating app.icns from app.png"
              rm -rf "$ICON_DIR/App.iconset" || true
              mkdir -p "$ICON_DIR/App.iconset"
              sips -z 16 16 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_16x16.png"
              sips -z 32 32 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_16x16@2x.png"
              sips -z 32 32 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_32x32.png"
              sips -z 64 64 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_32x32@2x.png"
              sips -z 128 128 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_128x128.png"
              sips -z 256 256 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_128x128@2x.png"
              sips -z 256 256 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_256x256.png"
              sips -z 512 512 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_256x256@2x.png"
              sips -z 512 512 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_512x512.png"
              sips -z 1024 1024 "$ICON_DIR/app.png" --out "$ICON_DIR/App.iconset/icon_512x512@2x.png"
              iconutil -c icns "$ICON_DIR/App.iconset" -o "$ICON_DIR/app.icns" || true
              rm -rf "$ICON_DIR/App.iconset"
            else
              echo "No app.png to generate icons"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: Create server.properties
        run: |
          mkdir -p src/commonMain/resources
          echo "server.ip=chatlite.xin" > src/commonMain/resources/server.properties
        shell: bash

      - name: Build installers
        run: ./gradlew clean stageDesktopReleaseArtifacts desktopSizeReport
        shell: bash

      - name: Optional sign & notarize (macOS)
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          MACOS_IDENTITY: ${{ secrets.MACOS_IDENTITY }}
        run: |
          set -e
          if [ -z "$APPLE_API_KEY_BASE64" ] || [ -z "$APPLE_KEY_ID" ] || [ -z "$APPLE_ISSUER_ID" ]; then
            echo "Skipping macOS sign & notarize: required secrets not provided."
            exit 0
          fi
          echo "Decoding Apple API key"
          trap 'rm -f apple_api_key.p8' EXIT
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > apple_api_key.p8
          ARTIFACT=$(find build/release-artifacts/desktop -type f -name "*.dmg" | head -n 1 || true)
          if [ -n "$ARTIFACT" ]; then
            echo "Found dmg: $ARTIFACT"
            # Optional signing step: requires MACOS_IDENTITY secret
            if [ -n "$MACOS_IDENTITY" ]; then
              echo "Signing app inside DMG (best-effort)"
              TMPMOUNT=$(mktemp -d)
              hdiutil attach "$ARTIFACT" -mountpoint "$TMPMOUNT" -nobrowse
              APP_PATH=$(find "$TMPMOUNT" -maxdepth 2 -name "*.app" | head -n 1 || true)
              if [ -n "$APP_PATH" ]; then
                codesign --timestamp --options runtime --sign "$MACOS_IDENTITY" "$APP_PATH"
              fi
              hdiutil detach "$TMPMOUNT" || true
            fi
            # Notarize using xcrun notarytool
            xcrun notarytool submit "$ARTIFACT" --key apple_api_key.p8 --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID" --wait
            xcrun stapler staple "$ARTIFACT" || true
          else
            echo "No DMG found to notarize"
          fi

          # ZIP is a separate distribution: sign/notarize its .app too.
          # ZIP files cannot be stapled; staple the app and recreate the ZIP.
          if [ -n "$MACOS_IDENTITY" ]; then
            APP_IMAGE="build/compose/binaries/main-release/app/chatlite.app"
            ARCHIVES=(build/release-artifacts/desktop/chatlite-*-macos-*.zip)
            [ "${#ARCHIVES[@]}" -eq 1 ] && [ -f "${ARCHIVES[0]}" ]
            ZIP_PATH="${ARCHIVES[0]}"
            bash scripts/sign-macos.sh "$APP_IMAGE"
            codesign --verify --deep --strict "$APP_IMAGE"
            rm -f "$ZIP_PATH"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_IMAGE" "$ZIP_PATH"
            xcrun notarytool submit "$ZIP_PATH" --key apple_api_key.p8 --key-id "$APPLE_KEY_ID" --issuer "$APPLE_ISSUER_ID" --wait
            xcrun stapler staple "$APP_IMAGE"
            xcrun stapler validate "$APP_IMAGE"
            rm -f "$ZIP_PATH"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_IMAGE" "$ZIP_PATH"
          else
            echo "ZIP remains unsigned: MACOS_IDENTITY was not provided."
          fi

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: desktop-size-macos
          path: build/reports/packaging/desktop-size.txt
          if-no-files-found: error

      - name: List staged desktop artifacts (macOS)
        run: |
          if [ -d "build/release-artifacts/desktop" ]; then
            ls -la build/release-artifacts/desktop || true
          else
            echo "No staged desktop artifacts found"
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers
          path: build/release-artifacts/desktop/**
          compression-level: 0
          if-no-files-found: error

  build-linux:
    name: Build DEB + tar.gz (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Prepare icons (Linux)
        run: |
          ICON_DIR=packaging/icons
          if [ ! -d "$ICON_DIR" ]; then
            echo "No icon dir: $ICON_DIR"; exit 0
          fi
          if [ -f "$ICON_DIR/app.png" ]; then
            echo "app.png exists"
          else
            if [ -f "$ICON_DIR/app.svg" ]; then
              echo "Converting app.svg -> app.png"
              sudo apt-get update -y
              sudo apt-get install -y imagemagick || true
              magick convert "$ICON_DIR/app.svg" "$ICON_DIR/app.png" || true
            fi
            if [ -f "$ICON_DIR/app.png.b64" ]; then
              echo "Decoding app.png from base64"
              base64 --decode "$ICON_DIR/app.png.b64" > "$ICON_DIR/app.png"
            fi
          fi

      - name: Install packaging deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fakeroot dpkg-dev || true

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: Create server.properties
        run: |
          mkdir -p src/commonMain/resources
          echo "server.ip=chatlite.xin" > src/commonMain/resources/server.properties
        shell: bash

      - name: Build installers
        run: ./gradlew clean stageDesktopReleaseArtifacts desktopSizeReport --no-daemon
        shell: bash

      - name: Upload size report
        uses: actions/upload-artifact@v7
        with:
          name: desktop-size-linux
          path: build/reports/packaging/desktop-size.txt
          if-no-files-found: error

      - name: List staged desktop artifacts (Linux)
        run: |
          if [ -d "build/release-artifacts/desktop" ]; then
            ls -la build/release-artifacts/desktop || true
          else
            echo "No staged desktop artifacts found"
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: build/release-artifacts/desktop/**
          compression-level: 0
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # setup-android@v4 已把新版 sdkmanager 加入 PATH，不再依赖镜像预装的 cmdline-tools/latest 路径
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Set up raw QUIC native toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --target aarch64-linux-android --target x86_64-linux-android
          sdkmanager "ndk;27.3.13750724"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev
          libclang_library="$(find /usr/lib /usr/local/lib \( -type f -o -type l \) \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) -print -quit)"
          if [ -z "$libclang_library" ]; then
            echo "::error::libclang shared library was not found after installing libclang-dev"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$libclang_library")" >> "$GITHUB_ENV"
          echo "Using libclang at $libclang_library"
        shell: bash

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: Create server.properties
        run: |
          mkdir -p src/commonMain/resources
          echo "server.ip=chatlite.xin" > src/commonMain/resources/server.properties
        shell: bash

      - name: Build Android release APK
        run: ./gradlew :androidApp:clean :androidApp:assembleRelease :androidApp:testReleaseUnitTest --no-daemon
        shell: bash

      - name: Stage release artifact
        run: ./gradlew stageAndroidReleaseArtifact --no-daemon
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/release-artifacts/android/**

      - name: Upload Android R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: android-r8-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
          compression-level: 6
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-macos, build-linux, build-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-installers
          path: artifacts/macos

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-installers
          path: artifacts/linux

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "build-${{ github.run_id }}"
          name: "CharRoom build ${{ github.run_id }}"
          body: "Automated build artifacts"
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.apk
